<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="css/contato.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="image/header/logotipo.jpg" />
  <title>Sabor Maneiro</title>
</head>

<body>
  <header>
    <div class="logo">
      <img src="image/header/logotipo.jpg" alt="Logo do Restaurante" />
    </div>
    <nav class="menu">
      <ul>
        <li><a href="index.html">Home</a></li>

        <li><a href="history.html">Nossa história</a></li>

        <li><a href="index.html">Galeria</a></li>

        <li class="menu_pedido"><a href="index.html">Faça seu pedido</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="principal">
      <section class="formularios">
        <form name="teste" method="post" action="{% url 'gravar' %}">
          <label for="primeiroNome">Nome</label>
          <input type="text" id="primeiroNome" name="primeiroNome" required>

          <label for="sobrenome">Sobrenome</label>
          <input type="text" id="sobrenome" name="sobrenome"> <br> <br>

          <label for="email">Email:</label>
          <input type="text" id="email" name="email" required> <br> <br>

          <label for="celular">Celular:</label>
          <input type="tel" name="ddd" id="ddd" placeholder="(DDD)" required>
          <input type="tel" name="telefone" id="telefone" placeholder="Número do Telefone"> <br> <br>

          <label for="assunto">Assunto:</label>
          <select name="assunto" id="assunto" required>
            <option value="" disable selected> Selecione o Assunto</option>
            <option value="pedido">Pedido</option>
            <option value="duvida">Dúvida</option>
            <option value="sugestao">Sugestão</option>
            <option value="reclamacao">Reclamação</option>
          </select> <br> <br>

          <label for="mensagem">Mensagem:</label>
          <textarea name="mensagem" id="mensagem" required></textarea> <br> <br>

          <div class="enviar">
            <input type="submit" value="Enviar">
          </div>
        </form>
      </section>
      <section class="informations">
        <div class="mapa-conteudo">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3277.8680223490546!2d-43.45192565264827!3d-22.754897702710057!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9967a99225f96f%3A0xec20bfc8ff090b46!2sSenac%20Nova%20Igua%C3%A7u!5e0!3m2!1spt-BR!2sbr!4v1740447429919!5m2!1spt-BR!2sbr"
          style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
        <address>
          Rua Cel. Carlos Matos, Centro, 86 <br>
          Nova Iguaçu-RJ <br>
          CEP:26210-200
        </address>
        </div>
      </section>

    </section>
  </main>
  <footer>
    <section class="footer-contact">
      <div class="contact">
        <h2>Contato</h2>
        <p>saborm@gmail.com</p>
        <p>(21)99110-0654</p>
      </div>
    </section>
    <section class="name">
      <h2>Sabor Maneiro</h2>
    </section>
    <section class="social-midia">
      <h2>Redes-Sociais</h2>
      <nav class="links-rodape">
        <ul>
          <li>
            <a href="https://www.instagram.com" target="_blank"> <i class="fa-brands fa-instagram"></i></a>
          </li>


          <li>
            <a href="https://facebook.com" target="_blank"> <i class="fa-brands fa-facebook-f"></i> </a>
          </li>


          <li>
            <a href="https://www.tiktok.com/upload?lang=pt-BR" target="_blank"> <i class="fa-brands fa-tiktok"></i>
            </a>
          </li>
        </ul>
      </nav>
    </section>
  </footer>

</body>

</html>
