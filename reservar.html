<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/reservar.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" href="image/header/logotipo.jpg" />
    <title>Sabor Maneiro</title>
  </head>

  <body>
    <header>
      <div class="logo">
        <img src="image/header/logotipo.jpg" alt="Logo do Restaurante" />
      </div>
      <nav class="menu">
        <ul>
          <li><a href="index.html">Home</a></li>

          <li><a href="history.html">Nossa história</a></li>

          <li><a href="galeria.html">Galeria</a></li>

          <li class="menu_pedido"><a href="order.html">Faça seu pedido</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="form-container">
        <h2>Reserva</h2>
        <form>
          <div class="form-group">
            <label for="nome"
              >Nome <span style="color: red">(obrigatório)</span></label
            >
            <input type="text" id="nome" name="nome" required />
          </div>
          <div class="form-group">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" name="sobrenome" />
          </div>
          <div class="form-group">
            <label for="telefone"
              >Telefone <span style="color: red">*</span></label
            >
            <input type="tel" id="telefone" name="telefone" required />
          </div>
          <div class="form-group">
            <label for="email">Endereço de e-mail</label>
            <input type="email" id="email" name="email" />
          </div>
          <div class="form-group">
            <label for="data"
              >Data <span style="color: red">*</span>
              <small>(dd/mm/aaaa)</small></label
            >
            <input type="date" id="data" name="data" required />
          </div>
          <div class="form-group">
            <label for="convidados"
              >Número de convidados <span style="color: red">*</span></label
            >
            <input
              type="number"
              id="convidados"
              name="convidados"
              min="1"
              required
            />
          </div>
          <div class="form-group">
            <label for="comentarios">Comentários</label>
            <textarea id="comentarios" name="comentarios"></textarea>
          </div>
          <button type="submit">Enviar</button>
        </form>
      </div>
    </main>
    <footer>
      <section class="footer-contact">
        <div class="contact">
          <h2>Contato</h2>
          <p>
            <strong>Email:</strong>
            <a href="mailto:saborm@gmail.com">saborm@gmail.com</a>
          </p>
          <p>
            <strong>Telefone:</strong>
            <a href="tel:+55(21)99110-0654">(21) 99110-0654</a>
          </p>
        </div>
      </section>
      <section class="name">
        <h2>Sabor Maneiro</h2>
      </section>
      <section class="social-midia">
        <h2>Redes-Sociais</h2>
        <nav class="links-rodape">
          <ul>
            <li>
              <a href="https://www.instagram.com" target="_blank">
                <i class="fa-brands fa-instagram"></i
              ></a>
            </li>

            <li>
              <a href="https://facebook.com" target="_blank">
                <i class="fa-brands fa-facebook-f"></i>
              </a>
            </li>

            <li>
              <a
                href="https://www.tiktok.com/upload?lang=pt-BR"
                target="_blank"
              >
                <i class="fa-brands fa-tiktok"></i>
              </a>
            </li>
          </ul>
        </nav>
      </section>
    </footer>
  </body>
</html>
